function createBackup() {
  const now = new Date();
  const data = {format: 'project-planner-backup', version: 1, exportedAt: now.toISOString(), activeId, projects};
  return {
    name: 'project-planner-backup-' + iso(now),
    contents: new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'})

}

function downloadBackup(backup) {
  const url = URL.createObjectURL(backup.contents);
  const link = document.createElement('a');
  link.href = url;
  link.download = backup.name + '.json';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function showBackupStatus(message) {
  const status = $('#backupStatus');
  status.hidden = !message;
  status.textContent = message;
}

function exportBackup() {
  showBackupStatus('');
  downloadBackup(createBackup());
  toast('已開始下載備份檔');
}

async function shareBackup(button) {
  if (button.disabled) return;
  showBackupStatus('');
  const backup = createBackup();
  button.disabled = true;
  try {
    if (typeof File === 'function' && navigator.share && navigator.canShare) {
      // Some share sheets accept plain text attachments but decline JSON.
      for (const [extension, type] of [['.json', 'application/json'], ['.txt', 'text/plain']]) {
        const file = new File([backup.contents], backup.name + extension, {type});
        const payload = {files: [file]};
        if (!navigator.canShare(payload)) continue;
        await navigator.share(payload);
        if (extension === '.txt') showBackupStatus('本次使用文字檔分享，收件人可直接用「匯入備份」開啟。');
        return;
      }
    }
    downloadBackup(backup);
    showBackupStatus('此瀏覽器無法直接分享附件，已開始下載備份。請從「檔案」開啟下載項目，點「分享」後選擇 LINE 或其他 App。');
  } catch (error) {
    if (error.name !== 'AbortError') {
      showBackupStatus('未能開啟檔案分享。可再次點選「分享備份」，或使用「匯出備份」下載後分享。');
    }
  } finally {
    button.disabled = false;
  }
}

function startDrag(event) {
  if (!event.isPrimary || event.button !== 0) return;
  const bar = event.currentTarget;
  const project = active();
  const task = project.tasks.find(item => item.id === bar.dataset.bar);
  if (!task) return;
  const resize = !task.milestone && event.target.classList.contains('barHandle');
  const start = parse(task.start);
  const end = parse(task.end);
  const duration = Math.round((end - start) / 86400000) + 1;
  const dayWidth = bar.parentElement.clientWidth / days;
  const originalWidth = bar.style.width;
  const pointerId = event.pointerId;
  const origin = event.clientX;
  let delta = 0;

  function move(pointer) {
    if (pointer.pointerId !== pointerId) return;
    delta = Math.round((pointer.clientX - origin) / dayWidth);
    if (resize) {
      delta = Math.max(1 - duration, delta);
      bar.style.width = ((duration + delta) / days * 100) + '%';
    } else {
      bar.style.transform = 'translateX(' + (delta * dayWidth) + 'px)' + (task.milestone ? ' rotate(45deg)' : '');
    }
  }

  function finish(pointer) {
    if (pointer.pointerId !== pointerId) return;
    bar.removeEventListener('pointermove', move);
    bar.removeEventListener('pointerup', finish);
    bar.removeEventListener('pointercancel', finish);
    bar.removeEventListener('lostpointercapture', finish);
    const commit = pointer.type === 'pointerup';
    if (commit) move(pointer);
    if (bar.hasPointerCapture(pointerId)) bar.releasePointerCapture(pointerId);
    bar.style.width = originalWidth;
    bar.style.removeProperty('transform');
    if (!commit || !delta) return;
    const before = task.start + ' – ' + task.end;
    setTaskDates(project, task, iso(resize ? start : add(start, delta)), iso(add(end, delta)));
    record(project, '調整時程', task.name, '日期：' + before + ' → ' + task.start + ' – ' + task.end);
    persist();
    renderDetail();
  }

  bar.setPointerCapture(pointerId);
  bar.addEventListener('pointermove', move);
  bar.addEventListener('pointerup', finish);
  bar.addEventListener('pointercancel', finish);
  bar.addEventListener('lostpointercapture', finish);
}

const stopPan=e=>{if(!panState||e.pointerId!==panState.pointerId)return;panState=null;ganttWrap.classList.remove('isPanning')};
ganttWrap.addEventListener('pointerup',stopPan);ganttWrap.addEventListener('pointercancel',stopPan);ganttWrap.addEventListener('lostpointercapture',stopPan);
document.querySelectorAll('[data-project-filter]').forEach(b=>b.addEventListener('click',()=>{projectFilter=b.dataset.projectFilter;renderProjects()}));$('#projectSearch').addEventListener('input',renderProjects);$('#projectTemplate').addEventListener('change',()=>updateTemplatePreview(true));$('#projectStartNew').addEventListener('change',()=>{if($('#projectTemplate').value)updateTemplatePreview(false)});$('#topToday').textContent=today.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'new-project':openProject();break;case'new-task':openItem();break;case'back':showList();break;case'logs':showLogs();break;case'log-back':$('#logView').hidden=true;showDetail();break;case'export-backup':exportBackup();break;case'share-backup':shareBackup(b);break;case'import-backup':$('#backupFile').click();break;case'close-modal':closeModal();break;case'today':scrollToToday();break}});
$('#projectForm').addEventListener('submit',saveProjectForm);$('#itemForm').addEventListener('submit',saveForm);$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});$('#projectModalBack').addEventListener('click',e=>{if(e.target===$('#projectModalBack'))closeModal()});$('#backupFile').addEventListener('change',importBackup);$('#todoForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#todoInput'),text=input.value.trim();if(!text)return;const p=active();p.todos.push({id:id(),text,status:'todo'});record(p,'新增代辦',text,'新增代辦事項');input.value='';persist();renderTodos();input.focus()});$('#logSearch').addEventListener('input',renderLogs);
$('#projectName').addEventListener('change',()=>{const p=active(),before=p.project;p.project=$('#projectName').value.trim()||'未命名專案';if(before!==p.project)record(p,'修改專案名稱','專案資料',`${before} → ${p.project}`);persist()});const dateFields=['projectStart','projectEnd'];function updateDateSave(){const p=active();$('#saveProjectDates').disabled=$('#projectStart').value===p.start&&$('#projectEnd').value===p.end}for (const field of dateFields) {
  const input = document.getElementById(field);
  input.addEventListener('input', updateDateSave);
  input.addEventListener('change', updateDateSave);
}
$('#saveProjectDates').addEventListener('click',()=>{const p=active(),s=$('#projectStart').value,e=$('#projectEnd').value;if(!s||!e){toast('請選擇完整的專案日期');return}if(e<s){toast('結束日期不能早於起始日期');return}const oldStart=p.start,oldEnd=p.end;if(oldStart!==s||oldEnd!==e){p.start=s;p.end=e;record(p,'修改專案日期','專案資料',`${oldStart} – ${oldEnd} → ${s} – ${e}`);persist();renderDetail();toast('專案日期已儲存')}});$('#weekendToggle').addEventListener('click',()=>{active().weekends=!active().weekends;persist();renderDetail()});
load();projects.forEach(p=>{if(!Array.isArray(p.logs))p.logs=[]});ensureHardwareSample();showList();
